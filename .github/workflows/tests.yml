name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A new push cancels the previous run of the same branch. The event name is part of the group,
# so the push run and the pull_request run of the same commit do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      API_URL: ${{ vars.API_URL }}
      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      LOCKED_USER: ${{ secrets.LOCKED_USER }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      API_ADMIN_USER: ${{ secrets.API_ADMIN_USER }}
      API_ADMIN_PASSWORD: ${{ secrets.API_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint and typecheck
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
